name: Release

# Push a tag like v0.2.0 and this builds route-elevation-profile.zip and
# attaches it to a GitHub release. The "latest" download link in the README
# then always points at the newest version.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the version into metadata.txt
        run: sed -i "s/^version=.*/version=${GITHUB_REF_NAME#v}/" plugin/metadata.txt

      - name: Build the plugin zip
        run: |
          cd plugin
          zip -r ../route-elevation-profile.zip main.qml metadata.txt icon.svg

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" route-elevation-profile.zip \
            --title "$GITHUB_REF_NAME" --generate-notes
